name: autolog
description: AutoLog - Premium offline vehicle management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local database
  hive_flutter: ^1.1.0

  # Preferences
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Internationalisation
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # Media / file pickers
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # File system
  path_provider: ^2.1.3

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.2.7

  # Utilities
  uuid: ^4.4.2
  crypto: ^3.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  # Property-based testing
  fast_check: ^0.2.0

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/vehicle_database.json
    - assets/images/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
